<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arizona Public Service (APS) – Agent Call Script</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #1a1a1a;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .header img {
            height: 48px;
        }

        h1 {
            color: #003a8f;
            margin: 0;
            font-size: 22px;
        }

        h2 {
            color: #4d4f53;
            font-size: 16px;
            margin: 4px 0 0 0;
        }

        form {
            max-width: 900px;
            background-color: #ffffff;
            padding: 20px 24px;
            border-radius: 4px;
        }

        fieldset {
            border: 1px solid #d0d5db;
            margin-bottom: 20px;
            padding: 16px;
        }

        legend {
            padding: 0 8px;
            font-weight: bold;
            color: #003a8f;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
            color: #333333;
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #b8bcc2;
            border-radius: 2px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .column {
            flex: 1;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .status-indicator {
            font-size: 13px;
            color: #4d4f53;
        }

        .button-row {
            margin-bottom: 20px;
        }

        .outage-button {
            background-color: #003a8f;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
        }

        .outage-button:hover {
            background-color: #002e6f;
        }

        .footer-note {
            font-size: 12px;
            color: #6b6e73;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="header">
        <img 
            src="https://www.aps.com/Assets/Images/logo.svg"
            alt="Arizona Public Service Logo">
        <div>
            <h1>Arizona Public Service</h1>
            <h2>Agent Voice Call Script</h2>
        </div>
    </div>

    <form>

        <div class="button-row">
            <button type="button" class="outage-button">
                Report an Outage
            </button>
        </div>

        <fieldset>
            <legend>Customer Information</legend>

            <div class="row">
                <div class="column">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName">
                </div>

                <div class="column">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName">
                </div>
            </div>

            <div class="row">
                <div class="column">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber">
                </div>

                <div class="column">
                    <label for="startServiceDate">Start of Service Date</label>
                    <input type="date" id="startServiceDate" name="startServiceDate">
                </div>
            </div>

            <label for="address">Service Address</label>
            <input type="text" id="address" name="address">

        </fieldset>

        <fieldset>
            <legend>Account Details</legend>

            <div class="row">
                <div class="column">
                    <label for="accountNumber">Account Number</label>
                    <input type="text" id="accountNumber" name="accountNumber">
                </div>

                <div class="column">
                    <label for="accountBalance">Account Balance</label>
                    <input type="text" id="accountBalance" name="accountBalance">
                </div>
            </div>

            <label for="planRateDetails">Plan Rate Details</label>
            <textarea id="planRateDetails" name="planRateDetails" rows="4"></textarea>

        </fieldset>

        <fieldset>
            <legend>Verification & Call Context</legend>

            <label>Identity Verification Status</label>
            <div class="checkbox-row">
                <input type="checkbox" id="identityVerified" name="identityVerified" value="true">
                <label for="identityVerified">Verified</label>
                <span class="status-indicator">(True / False)</span>
            </div>

            <br>

            <label for="callerIntent">Caller Intent</label>
            <textarea id="callerIntent" name="callerIntent" rows="4"></textarea>

        </fieldset>

        <div class="footer-note">
            APS Confidential – For Authorized Agent Use Only
        </div>

    </form>

</body>
</html>
