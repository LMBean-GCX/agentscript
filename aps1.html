<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arizona Public Service – Agent Script</title> 

<style>
  :root {
    --primary: #003a8f;
    --primary-light: #e8f1fb;
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --text-main: #1f2d3d;
    --text-muted: #5f6c7b;
    --radius: 14px;
    --shadow: 0 4px 14px rgba(0,0,0,0.08);
  }

  body {
    margin: 0;
    background: var(--bg);
    font-family: "Segoe UI", sans-serif;
    padding: 20px 16px;
  }

  .container { max-width: 1100px; margin: auto; }

  .header {
    background: var(--primary);
    color: #fff;
    padding: 16px 24px;
    border-radius: var(--radius);
    font-size: 1.25rem;
    font-weight: 600;
    text-align: center;
    margin-bottom: 12px;
  }

  .outage-bar { text-align: center; margin-bottom: 22px; }

  .btn {
    padding: 14px 20px;
    border-radius: var(--radius);
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-primary { background: var(--primary); color: #fff; }

  .tabs {
    display: flex;
    gap: 6px;
    border-bottom: 2px solid #d7e0ea;
    margin-bottom: 20px;
  }

  .tab {
    padding: 10px 14px;
    cursor: pointer;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 3px solid transparent;
  }

  .tab.active {
    color: var(--primary);
    border-bottom: 3px solid var(--primary);
  }

  .card {
    background: var(--card-bg);
    padding: 22px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }

  h3 { margin-top: 0; color: var(--primary); }

  label {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-muted);
    display: block;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd7e3;
    border-radius: var(--radius);
    margin-bottom: 16px;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  .check-item {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>
</head>

<body>

<div class="container">

  <div class="header">Arizona Public Service</div>

  <div class="outage-bar">
    <button class="btn btn-primary" type="button">
      Report an Outage
    </button>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="context">Customer Context</div>
    <div class="tab" data-tab="workflow">Workflow</div>
  </div>

  <!-- -------- CUSTOMER CONTEXT -------- -->
  <div id="context" class="tab-content active">
    <div class="card">
      <h3>Customer Context</h3>

      <div class="grid-2">
        <div><label>First Name</label><input id="firstName"></div>
        <div><label>Last Name</label><input id="lastName"></div>

        <div><label>Phone Number</label><input id="phoneNumber"></div>
        <div><label>Account Number</label><input id="accountNumber"></div>

        <div><label>Service Address</label><input id="address"></div>
        <div><label>Start of Service Date</label><input id="startServiceDate"></div>

        <div><label>Account Balance</label><input id="accountBalance"></div>
        <div><label>Plan Rate Details</label><input id="planRate"></div>
      </div>

      <div class="check-item">
        <input type="checkbox" id="identityVerified">
        <label for="identityVerified">Identity Verified</label>
      </div>

      <label>Caller Intent</label>
      <input id="callerIntent">
    </div>
  </div>

  <!-- -------- WORKFLOW -------- -->
  <div id="workflow" class="tab-content">
    <div class="card">
      <h3>Outage & Service Workflow</h3>
      <div class="check-item"><input type="checkbox">Verify identity</div>
      <div class="check-item"><input type="checkbox">Confirm service address</div>
      <div class="check-item"><input type="checkbox">Check outage map</div>
      <div class="check-item"><input type="checkbox">Submit outage report</div>
    </div>
  </div>

</div>

<!-- ---------------- FIELD MAPPING SCRIPT ---------------- -->
<script>
  /* ----- Tabs ----- */
  const tabs = document.querySelectorAll(".tab");
  const contents = document.querySelectorAll(".tab-content");

  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      contents.forEach(c => c.classList.remove("active"));
      document.getElementById(tab.dataset.tab).classList.add("active");
    });
  });

  /* ----- Query Params ----- */
  const qp = new URLSearchParams(window.location.search);

  function getQP(...keys) {
    for (let k of keys) {
      const v = qp.get(k);
      if (v && v.trim() !== "") return v;
    }
    return "";
  }

  function cleanPhone(v="") {
    return v.replace(/[^\d]/g,"");
  }

  function setField(id, val) {
    const el = document.getElementById(id);
    if (el && val) el.value = val;
  }

  /* ----- APS FIELD MAPPING ----- */
  setField("firstName", getQP("FirstName","first_name","fname","FNAME"));
  setField("lastName", getQP("LastName","last_name","lname","LNAME"));
  setField("phoneNumber", cleanPhone(getQP("ANI","Phone","phone","ContactNumber")));
  setField("accountNumber", getQP("AccountNumber","acct","ACCOUNT"));
  setField("address", getQP("Address","ServiceAddress","service_address"));
  setField("startServiceDate", getQP("StartDate","ServiceStartDate"));
  setField("accountBalance", getQP("Balance","AccountBalance"));
  setField("planRate", getQP("RatePlan","PlanRate"));
  setField("callerIntent", getQP("Intent","CallerIntent"));

  /* ----- Identity Flag ----- */
  const verified = getQP("IdentityVerified","verified");
  if (verified === "true" || verified === "1") {
    document.getElementById("identityVerified").checked = true;
  }
</script>

</body>
</html>
