<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arizona Public Service</title>

<style>
  :root {
    --primary: #003a8f;
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1f2d3d;
    --muted: #5f6c7b;
    --radius: 12px;
    --shadow: 0 4px 14px rgba(0,0,0,0.08);
  }

  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
  }

  .container {
    max-width: 1100px;
    margin: auto;
  }

  .header {
    background: var(--primary);
    color: #fff;
    padding: 16px;
    border-radius: var(--radius);
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 12px;
  }

  .outage-bar {
    text-align: center;
    margin-bottom: 20px;
  }

  button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 12px 18px;
    border-radius: var(--radius);
    font-weight: bold;
    cursor: pointer;
  }

  .tabs {
    display: flex;
    gap: 6px;
    border-bottom: 2px solid #d7e0ea;
    margin-bottom: 16px;
  }

  .tab {
    padding: 10px 14px;
    cursor: pointer;
    font-weight: bold;
    color: var(--muted);
    border-bottom: 3px solid transparent;
  }

  .tab.active {
    color: var(--primary);
    border-bottom: 3px solid var(--primary);
  }

  .card {
    background: var(--card);
    padding: 20px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }

  h3 {
    margin-top: 0;
    color: var(--primary);
  }

  label {
    font-size: 12px;
    font-weight: bold;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
  }

  input {
    width: 100%;
    padding: 10px;
    border-radius: var(--radius);
    border: 1px solid #cbd7e3;
    margin-bottom: 14px;
    box-sizing: border-box;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
  }

  .check {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }
</style>
</head>

<body>

<div class="container">

  <div class="header">Arizona Public Service</div>

  <div class="outage-bar">
    <button type="button">Report an Outage</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="context">Customer Context</div>
    <div class="tab" data-tab="workflow">Workflow</div>
  </div>

  <!-- CUSTOMER CONTEXT -->
  <div id="context" class="tab-content active">
    <div class="card">
      <h3>Customer Context</h3>

      <div class="grid">
        <div>
          <label>First Name</label>
          <input id="firstName">
        </div>
        <div>
          <label>Last Name</label>
          <input id="lastName">
        </div>

        <div>
          <label>Phone Number</label>
          <input id="phoneNumber">
        </div>
        <div>
          <label>Account Number</label>
          <input id="accountNumber">
        </div>

        <div>
          <label>Service Address</label>
          <input id="address">
        </div>
        <div>
          <label>Start of Service Date</label>
          <input id="startDate">
        </div>

        <div>
          <label>Account Balance</label>
          <input id="balance">
        </div>
        <div>
          <label>Plan Rate Details</label>
          <input id="planRate">
        </div>
      </div>

      <div class="check">
        <input type="checkbox" id="verified">
        <label for="verified">Identity Verified</label>
      </div>

      <label>Caller Intent</label>
      <input id="intent">
    </div>
  </div>

  <!-- WORKFLOW -->
  <div id="workflow" class="tab-content">
    <div class="card">
      <h3>Outage Workflow</h3>
      <div class="check"><input type="checkbox"> Verify identity</div>
      <div class="check"><input type="checkbox"> Confirm service address</div>
      <div class="check"><input type="checkbox"> Check outage map</div>
      <div class="check"><input type="checkbox"> Submit outage report</div>
      <div class="check"><input type="checkbox"> Provide ETA</div>
    </div>
  </div>

</div>

<script>
/* Tabs */
var tabs = document.querySelectorAll(".tab");
var contents = document.querySelectorAll(".tab-content");

for (var i = 0; i < tabs.length; i++) {
  tabs[i].addEventListener("click", function () {
    for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove("active");
    this.classList.add("active");

    for (var k = 0; k < contents.length; k++) contents[k].classList.remove("active");
    document.getElementById(this.getAttribute("data-tab")).classList.add("active");
  });
}

/* Query Params */
var qp = new URLSearchParams(window.location.search);

function qpGet() {
  for (var i = 0; i < arguments.length; i++) {
    var v = qp.get(arguments[i]);
    if (v) return v;
  }
  return "";
}

function setVal(id, val) {
  var el = document.getElementById(id);
  if (el && val) el.value = val;
}

/* Field Mapping */
setVal("firstName", qpGet("FirstName","fname","FNAME"));
setVal("lastName", qpGet("LastName","lname","LNAME"));
setVal("phoneNumber", qpGet("ANI","phone","Phone"));
setVal("accountNumber", qpGet("AccountNumber","ACCOUNT"));
setVal("address", qpGet("Address","ServiceAddress"));
setVal("startDate", qpGet("StartDate","ServiceStartDate"));
setVal("balance", qpGet("Balance","AccountBalance"));
setVal("planRate", qpGet("RatePlan","PlanRate"));
setVal("intent", qpGet("Intent","CallerIntent"));

if (qpGet("IdentityVerified") === "true") {
  document.getElementById("verified").checked = true;
}
</script>

</body>
</html>
